backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  # ============================================
  # NEWS & UPDATES
  # ============================================
  - name: "news"
    label: "News & Updates"
    label_singular: "News Post"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "tag", widget: "select", options: ["Education", "Agriculture", "Livelihoods", "Training", "Infrastructure", "Literacy", "Community", "Events"] }
      - { label: "Featured Post", name: "featured", widget: "boolean", default: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Short Summary", name: "excerpt", widget: "text", pattern: ['.{10,300}', "Must be between 10 and 300 characters"] }
      - { label: "Full Content", name: "body", widget: "markdown" }

  # ============================================
  # IMPACT STORIES
  # ============================================
  - name: "stories"
    label: "Impact Stories"
    label_singular: "Story"
    folder: "content/stories"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Quote / Testimonial", name: "quote", widget: "text" }
      - { label: "Person's Name (or role)", name: "name", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Program", name: "program", widget: "select", options: ["VSLA Program", "EDC Youth Advance", "Adult Literacy Program", "Hummingbird Academy", "Holy Hands Institute", "CSA Program", "Business Training"] }
      - { label: "Photo", name: "image", widget: "image", required: false }

  # ============================================
  # PHOTO GALLERY
  # ============================================
  - name: "gallery"
    label: "Photo Gallery"
    label_singular: "Photo"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Caption", name: "title", widget: "string" }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Category", name: "category", widget: "select", options: ["VSLA Training", "EDC Youth", "Hummingbird Academy", "Holy Hands Institute", "CSA Farm", "Community Events", "Leadership", "Other"] }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime", required: false }

  # NOTE: The "settings" collection (contact / donation / impact numbers)
  # was removed. The site currently reads these values from source code,
  # not from CMS-managed JSON, so exposing the fields here caused
  # confusion (editors would edit the JSON and see no change on the
  # live site). Re-enable this collection only when the corresponding
  # pages are wired to read from content/settings/*.json at build time.
